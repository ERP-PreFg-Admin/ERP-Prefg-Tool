name: Build and deploy

on:
  push:
    branches: [main]
    paths:
      - "erp_project/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        required: true
        default: test
        type: choice
        options: [test, prod]
      # No machine can read a diff and know whether it is a bugfix or a feature —
      # that is a judgement about intent. Prod deploys are already a deliberate
      # manual dispatch, so the decision goes where a human already is, rather than
      # depending on commit-message discipline.
      # Ignored on test deploys, which are identified by SHA and cut no tag.
      bump:
        description: "Version bump (prod only)"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major, none]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: erp-app

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: erp_project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: erp_project/package-lock.json

      - run: npm ci
      - run: npm run lint
        continue-on-error: true # 319 pre-existing issues as of 2026-07-07; visible in logs, not yet gating
      - run: npm run build

  build-and-push:
    needs: lint-and-build
    runs-on: ubuntu-latest
    # Two pushes in quick succession would otherwise race `docker rm -f erp` on the same box.
    concurrency:
      group: deploy-${{ github.event.inputs.environment || 'test' }}
      cancel-in-progress: false
    permissions:
      id-token: write
      # write, not read: the release step pushes a version tag.
      contents: write
    outputs:
      environment: ${{ steps.target.outputs.environment }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Load-bearing. The default shallow clone fetches NO tags, so `git tag -l`
          # comes back empty, every release computes from v0.0.0, and the version is
          # forever v0.0.1 while looking like it worked.
          fetch-depth: 0

      - name: Determine target environment
        id: target
        run: |
          # workflow_dispatch lets a human pick test or prod; a plain push to
          # main always goes to test — prod is a deliberate, manually-triggered promotion.
          echo "environment=${{ github.event.inputs.environment || 'test' }}" >> "$GITHUB_OUTPUT"

      # Version lives in git tags, never in package.json. Storing it in the file
      # would force CI to commit back to main on every release: a commit nobody
      # authored (which re-triggers this workflow), a merge conflict whenever two
      # branches touch the line, and a second source of truth to disagree with the
      # tag. Reading tags and pushing a new one costs none of that.
      - name: Compute version
        id: version
        if: steps.target.outputs.environment == 'prod' && github.event.inputs.bump != 'none'
        run: |
          # --sort=-v:refname is LOAD-BEARING: it sorts by version, not lexically.
          # Lexically v1.10.0 sorts BEFORE v1.9.0, so past version 9 every release
          # computes from the wrong base and the sequence silently goes backwards.
          LATEST=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            # First release ever starts at v1.0.0, whatever `bump` says. Bumping a
            # notional v0.0.0 would land on v0.0.1, which reads as "pre-release" for
            # an app that has been in production for months and whose package.json
            # has claimed 1.0.0 since the first commit.
            NEW="v1.0.0"
            echo "No existing tags — starting at $NEW (bump input ignored for the first release)"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"
            case "${{ github.event.inputs.bump }}" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
            esac
            # Lower components always reset to zero — this is what keeps it monotonic:
            # 1.0.5 --minor--> 1.1.0, never 1.1.5.
            NEW="v$MAJOR.$MINOR.$PATCH"
            echo "Releasing $LATEST -> $NEW"
          fi
          # Pushed BEFORE the build on purpose: if two prod deploys race, both read
          # the same LATEST and the loser's push is rejected here in seconds rather
          # than after a full build has been paid for.
          git tag "$NEW"
          git push origin "$NEW"
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (hosting account)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # The || fallback is what makes test builds SHA-identified without a
          # second code path: no tag was cut, so APP_VERSION is just the commit.
          docker build \
            --build-arg APP_VERSION="${{ steps.version.outputs.version || github.sha }}" \
            --build-arg GIT_SHA="${{ github.sha }}" \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t "$REGISTRY/$ECR_REPOSITORY:$ENVIRONMENT-$IMAGE_TAG" \
            -t "$REGISTRY/$ECR_REPOSITORY:$ENVIRONMENT" \
            erp_project
          docker push "$REGISTRY/$ECR_REPOSITORY:$ENVIRONMENT-$IMAGE_TAG"
          docker push "$REGISTRY/$ECR_REPOSITORY:$ENVIRONMENT"
          # The box pulls by digest, so a racing push can't move the tag under it.
          echo "ref=$(docker inspect --format '{{index .RepoDigests 0}}' "$REGISTRY/$ECR_REPOSITORY:$ENVIRONMENT-$IMAGE_TAG")" >> "$GITHUB_OUTPUT"

      - name: Roll out to EC2 via SSM
        id: rollout
        env:
          ENVIRONMENT: ${{ steps.target.outputs.environment }}
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_REF: ${{ steps.image.outputs.ref }}
        run: |
          test -n "$IMAGE_REF"
          # Values are baked in as a header; the body is a quoted heredoc so nothing in it expands here.
          {
            echo "set -euo pipefail"
            echo "ENVIRONMENT='$ENVIRONMENT' REGISTRY='$REGISTRY' IMAGE_REF='$IMAGE_REF' AWS_REGION='$AWS_REGION' EXPECT_SHA='${GITHUB_SHA:0:7}'"
            cat <<'REMOTE'
          report() {
            echo "--- container: $(docker inspect -f 'status={{.State.Status}} restarts={{.RestartCount}} image={{.Image}}' erp 2>&1)"
            echo "--- expected image: $(docker image inspect -f '{{.Id}}' "$IMAGE_REF" 2>&1)"
            echo "--- health: ${HEALTH:-<none>}"
            echo "--- logs:"; docker logs --tail 80 erp 2>&1 || true
          }
          field() { printf '%s' "$HEALTH" | sed -n "s/.*\"$1\":\"\([^\"]*\)\".*/\1/p"; }
          [ -n "$EXPECT_SHA" ] && [ -n "$IMAGE_REF" ]

          aws ssm get-parameters-by-path --path /erp-app/$ENVIRONMENT --with-decryption --region $AWS_REGION --query 'Parameters[].[Name,Value]' --output text | tr '\t' '=' | sed "s|^/erp-app/$ENVIRONMENT/||" > /etc/erp/env.new
          test -s /etc/erp/env.new
          chmod 600 /etc/erp/env.new && mv /etc/erp/env.new /etc/erp/env
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
          docker pull "$IMAGE_REF"
          docker rm -f erp || true
          docker run -d --name erp --restart unless-stopped -p 127.0.0.1:3000:3000 --env-file /etc/erp/env -v /var/log/erp:/app/logs "$IMAGE_REF"
          trap report EXIT

          OK=
          for i in $(seq 30); do
            HEALTH=$(curl -fsS --max-time 5 http://127.0.0.1:3000/api/health 2>/dev/null || true)
            if [ "$(field status)" = ok ] && [ "$(field commit)" = "$EXPECT_SHA" ] && [ "$(field env)" = "$ENVIRONMENT" ]; then OK=1; break; fi
            sleep 3
          done
          [ -n "$OK" ] || { echo "FAIL: health never reported status=ok commit=$EXPECT_SHA env=$ENVIRONMENT"; exit 1; }

          # Soak: a process that answers once then crash-loops would pass the poll between restarts.
          sleep 20
          [ "$(docker inspect -f '{{.RestartCount}}' erp)" = 0 ] || { echo "FAIL: container restarted during soak"; exit 1; }
          [ "$(docker inspect -f '{{.Image}}' erp)" = "$(docker image inspect -f '{{.Id}}' "$IMAGE_REF")" ] || { echo "FAIL: running image is not $IMAGE_REF"; exit 1; }

          docker image prune -f
          echo "OK: $IMAGE_REF live as $EXPECT_SHA on $ENVIRONMENT"
          REMOTE
          } > remote.sh
          jq -n --rawfile s remote.sh '{commands: ($s | split("\n"))}' > params.json
          CMD_ID=$(aws ssm send-command \
            --targets "Key=tag:Name,Values=erp-app-${ENVIRONMENT}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy erp-app:${ENVIRONMENT} ${GITHUB_SHA}" \
            --parameters file://params.json \
            --query 'Command.CommandId' --output text)
          echo "command_id=$CMD_ID" >> "$GITHUB_OUTPUT"
          echo "SSM command $CMD_ID"

      # send-command is async: without this step the job is green whatever happened on the box.
      - name: Verify rollout
        env:
          CMD_ID: ${{ steps.rollout.outputs.command_id }}
        run: |
          # Own loop, not `aws ssm wait command-executed`: that waiter gives up at ~100s.
          DEADLINE=$((SECONDS + 360))
          while :; do
            STATES=$(aws ssm list-command-invocations --command-id "$CMD_ID" --query 'CommandInvocations[].[InstanceId,Status]' --output text)
            if [ -z "$STATES" ] && [ $SECONDS -gt 30 ]; then
              echo "::error::SSM command reached no instance — does tag Name=erp-app-<env> match a running, SSM-managed box?"; exit 1
            fi
            if [ -n "$STATES" ] && ! grep -qE 'Pending|InProgress|Delayed' <<< "$STATES"; then break; fi
            [ $SECONDS -lt $DEADLINE ] || { echo "::error::Rollout still running after 6 min"; echo "$STATES"; exit 1; }
            sleep 10
          done

          FAILED=0
          while read -r INSTANCE STATUS; do
            echo "::group::$INSTANCE — $STATUS"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
              --query '[StandardOutputContent, StandardErrorContent]' --output text
            echo "::endgroup::"
            [ "$STATUS" = Success ] || { echo "::error::Rollout on $INSTANCE ended $STATUS"; FAILED=1; }
          done <<< "$STATES"
          exit $FAILED
